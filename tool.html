ren.","Ω_total = S0⊗S4⊗S3⊗S2⊗S1: Das Tensorprodukt aller fünf Zustandsräume S0 bis S4. Kein Nebeneinander, sondern Verschränkung — jeder Zustand existiert in jedem anderen.","canUebertreten = kann übertreten: Wer ein Level durchlaufen hat, darf die Schwelle zum nächsten überschreiten. Erlaubnis ist hier eine Systemeigenschaft, kein Button."],readout:"Ω = S0⊗S4⊗S3⊗S2⊗S1 · ÜBERTRITT ERLAUBT"},{id:"bus",time:"15:59:52",raw:"║ nutz-bus lokal + postMessage bridge",cmd:"BOOT · NUTZ-BUS",color:"var(--emerald)",colorName:"emerald",geometry:"Bus-Linie — Knoten & Brücke",shape:"bus",kartor:"027.WORK.MNA.750 · NC.room.js · nutz-bus lokal im NC_ROOM",title:"nutz-bus lokal + postMessage bridge",points:["Der nutz-bus ist ein lokaler Ereignisbus: Module sprechen miteinander, ohne sich direkt zu kennen — publish/subscribe im selben Raum.","Die postMessage bridge verbindet die Tabs: Jeder Browser-Tab ist ein eigenes Fenster, aber über postMessage schicken sie sich Nachrichten wie Briefe durch eine Wand mit Briefschlitz.","Lokal heißt: keine Cloud, kein Server dazwischen. Der Bus lebt auf dem Gerät — Q702-tauglich, offline ehrlich."],readout:"BUS LOKAL · BRIDGE AKTIV · 0 NETZWERK"},{id:"roll",time:"16:00:04",raw:"TOOLATOR ROLL · ROLL · Würfel · 81→27→3→0",cmd:"ROLL",color:"var(--amber)",colorName:"amber",geometry:"Würfel ⬛ — rollende Reduktion",shape:"cube",kartor:"081.WORK.GPU.820 · rawator-81.js · RAWATOR_81() — 81 Frames",title:"ROLL — Würfel-Defrag",points:["Der Würfel rollt und verliert bei jeder Kante Ballast: 81 HOLO-Frames sind die volle holografische Szene — jedes Frame ein Blickwinkel.","81 → 27: Die Frames falten sich zu 27 Strukturzellen (3×3×3 — der Würfel im Würfel). Aus Bildern wird Gerüst.","27 → 3: Das Gerüst kondensiert zum Kern aus 3 — Länge, Breite, Tiefe. Oder: These, Antithese, Synthese.","3 → 0: Der Kern löst sich zum Ursprung. 0 ist kein Nichts — es ist der Punkt, von dem aus alles neu gerollt werden kann. Cube Reduction vollständig."],readout:"81 FRAMES → 27 STRUKTUR → 3 KERN → 0 URSPRUNG"},{id:"rechne",time:"16:00:08",raw:"TOOLATOR RECHNE · RECHNE · 3 9 81 bio.tel → 9 81 729 9",cmd:"RECHNE",color:"var(--cyan)",colorName:"cyan",geometry:"Zylinder — rotierende Rechnung",shape:"cylinder",kartor:"009.IN.CLI.850 · beam.js · bio.tel-Kanal — Leben anrufen",title:"RECHNE — die Neuner-Maschine",points:["Die Rechnung ist eine einzige Operation, dreimal angewendet: 3×3=9, 9×9=81, 81×9=729. Alles wächst durch Multiplikation mit sich selbst und mit der 9.","Ausgabe 9 81 729 9: Die Quersummen sind 9, 9 (8+1), 9 (7+2+9=18→9), 9. Egal wie groß die Zahl wird — die 9 bleibt. Das ist der Loop aus dem Boot-Block, jetzt als Arithmetik bewiesen.","bio.tel: biology telephone? bio = Leben, tel = Fernsprecher. „Leben anrufen“ — die Rechnung als Anruf ans Lebendige: 3 9 81 wählen, und das Leben antwortet mit 9 81 729 9.","Der Zylinder dreht die Zahlen vorbei wie eine Walze im Rechenwerk: Eingabe links, Potenz in der Mitte, die ewige 9 rechts."],readout:"3×3=9 · 9×9=81 · 81×9=729 · QUERSUMME IMMER 9"},{id:"pipeline",time:"16:00:11",raw:"TOOLATOR PIPELINE · PIPELINE · P0-Pe · ATOM SCAN PREP BAKE ZIP CITY",cmd:"PIPELINE",color:"var(--emerald)",colorName:"emerald",geometry:"Pipeline — 6 Stufen P0→Pe",shape:"pipeline",kartor:"081.OUT.CTY.820 · MARKT.home.js · Endstufe CITY",title:"PIPELINE — vom Atom zur Stadt",points:["P0 bis Pe: Die Stufen der Verwandlung. P0 ist das rohe Atom, Pe die Perle am Ende — das fertige, runde Ergebnis (Pe = Perle: Druck macht aus dem Korn die Perle).","ATOM: Das Ausgangsmaterial — kleinste Einheit, unteilbar. SCAN: Das Atom wird gelesen, vermessen, verstanden.","PREP: Vorbereitung — sortieren, schneiden, bereitmachen. BAKE: Backen — Hitze und Zeit verwandeln den Teig; was gebacken ist, kann nicht mehr zurück.","ZIP: Verdichten — Luft raus, Essenz rein. CITY: Aus dem verdichteten Atom wird eine Stadt gebaut. Die Pipeline endet nicht beim Produkt, sondern beim Lebensraum."],readout:"ATOM → SCAN → PREP → BAKE → ZIP → CITY"},{id:"tab",time:"16:00:13",raw:"TAB PIPELINE → TAB SPRUNG (16:00:15)",cmd:"TAB SPRUNG",color:"var(--logblue)",colorName:"logblau",geometry:"Sprung — zwei Türen, ein Bogen",shape:"jump",kartor:"009.IN.CLI.850 · index.html · Sprungziel der 5 Tabs",title:"TAB SPRUNG — Tabs springen",points:["Zwei Logzeilen, zwei Sekunden Abstand: TAB PIPELINE, dann TAB SPRUNG. Der Nutzer wechselt den Raum — und das System merkt es sich.","Die 5 Tabs (ori / index / 9k.os / priv / kartor) sind keine Seiten, sondern Orte. Springen heißt: Kontext mitnehmen, nicht neu laden.","Über die postMessage bridge weiß jeder Tab, wo der andere steht. Der Sprung ist ein Übertreten im Kleinen — canUebertreten in Aktion."],readout:"TAB PIPELINE → TAB SPRUNG · KONTEXT BLEIBT"},{id:"seed",time:"16:00:17",raw:"TOOLATOR SEED · SEED · LIFE · 0⊃3⊃9⊃27⊃81⊃243⊃729→730 FREI",cmd:"SEED",color:"var(--violet)",colorName:"violett",geometry:"Pyramide — wachsende Stufen",shape:"pyramid",kartor:"729.MEM.ARC.215 · RAWATOR.id.json · Level 729 → 730 FREI",title:"SEED LIFE — die enthaltende Pyramide",points:["Das Zeichen ⊃ heißt „enthält als Obermenge“: 0 enthält 3, 3 enthält 9, 9 enthält 27 … Jede Stufe verliert die vorherige nicht — sie trägt sie in sich, wie Jahresringe einen Baum.","Die Folge ist die Dreierpotenz: 3⁰=1… nein, hier zählt das Wachstum: 3, 9, 27, 81, 243, 729 — jede Stufe verdreifacht die Welt, ohne die alte zu löschen.","729 → 730 FREI: Nach der letzten Potenz kommt keine 2187. Es kommt 730 — eins mehr als nötig — und das Wort FREI. Wer alle Stufen durchwachsen hat, tritt aus der Folge aus.","Nach 729 kommt Freiheit: Die Pyramide ist fertig, wenn man sie verlassen darf. Der Seed hat sein Leben gelebt — jetzt gehört es dir."],readout:"0⊃3⊃9⊃27⊃81⊃243⊃729 → 730 FREI"},{id:"echo",time:"16:00:23",raw:"TOOLATOR ECHO · ECHO · VESTA=HERDFEUER · IMMER AN",cmd:"ECHO",color:"var(--gold)",colorName:"gold",geometry:"Echo-Wellen — konzentrische Ringe",shape:"waves",kartor:"243.MEM.LOG.350 · RAWATOR.geo.json · Echo im Log-Sektor",title:"ECHO — das Herdfeuer antwortet",points:["Das Echo wiederholt den ersten Satz des Systems: VESTA=HERDFEUER. Was am Anfang Boot war, ist jetzt Antwort — der Raum spricht zurück.","IMMER AN: Das Echo bestätigt, dass die Flamme nie aus war. Zwischen Boot (15:59:52) und Echo (16:00:23) liegen 31 Sekunden — das Feuer hat nicht einmal geflackert.","Ein Echo ist der Beweis, dass etwas da ist, das reflektiert. Der Nutzraum ist nicht leer — er hat Wände, und die Wände sagen: an."],readout:"VESTA=HERDFEUER · IMMER AN · 31s BESTÄTIGT"},{id:"loop",time:"16:00:25",raw:"TOOLATOR LOOP · LOOP · 9 EVIG · MAURI STONE",cmd:"LOOP",color:"var(--red)",colorName:"rot",geometry:"Loop — die 9 als Kreis",shape:"loop",kartor:"729.MEM.HDF.209 · d.hdf.rom · der Stein liegt im ROM — unverrückbar",title:"LOOP — 9 EVIG, MAURI STONE",points:["Der Loop schließt den Kreis zum Boot: 9 EVIG — die Neun, die in jeder Rechnung wiederkehrt (siehe RECHNE), läuft ohne Abbruchbedingung. Nicht gefangen — getragen.","MAURI STONE: Der Lebensstein liegt im Zentrum des Loops. In der Māori-Tradition bewacht ein verborgener Stein die Lebenskraft eines Ortes — solange er liegt, lebt der Ort.","Loop + Stein = Herzschlag: Der Kreis dreht sich, der Stein bleibt. Bewegung um ein ruhendes, vitales Zentrum — exakt wie das Atom, das die PIPELINE zur Stadt baut."],readout:"9 EVIG · MAURI STONE IM ZENTRUM · KEIN EXIT"},{id:"mix",time:"16:00:29",raw:"TOOLATOR MIX · MIX · H/B/T man/woman/du // was sagt der mann",cmd:"MIX",color:"var(--magenta)",colorName:"magenta",geometry:"Drei Säulen — H · B · T",shape:"mix",kartor:"009.IN.CLI.850 · persona.loader.js · lädt man / woman / du",title:"MIX — H/B/T · man/woman/du",points:["H/B/T hat drei Lesarten, und alle stimmen gleichzeitig: HOLO / BORG / TOOLATOR — drei Weisen, im Raum zu sein: ganz sehend, kollektiv verbunden, werkzeugbewusst.","Oder: H = Herd (VESTA), B = BIOS, T = Toolator — Feuer, Leben, Werkzeug. Die drei Schichten des Boot-Blocks, jetzt als Stimmen.","man / woman / du: dieselben drei Positionen als Perspektiven — der Mann, die Frau und du selbst, die dritte Person, die gerade liest.","Die Frage im Log lautet: // was sagt der mann — sie wird unten in drei Spalten beantwortet."],readout:"H/B/T · MAN/WOMAN/DU · FRAGE OFFEN → ANTWORT UNTEN"}],I0=[{key:"H",role:"HOLO · Herd",who:"man — der Mann",color:"var(--magenta)",says:["„VESTA immer an.“","„ROLL: 81→27→3→0 — ich lasse los, bis der Ursprung bleibt.“","„SEED: nach 729 kommt 730 FREI — ich trete über.“","Kurz: Das Herdfeuer bleibt an, das BIOS bleibt an, der Loop läuft 9 evig. Der Mann sagt den Anfang — und meint ihn ernst."]},{key:"B",role:"BORG · Bios",who:"woman — die Frau",color:"var(--cyan)",says:["„RECHNE: 3 9 81 → 9 81 729 9 — ich verbinde, also wächst es.“","„PIPELINE: aus dem Atom baue ich die Stadt.“","„ECHO: ich antworte, damit niemand allein spricht.“","Kurz: Die Frau sagt die Verbindung — bio.tel, Leben anrufen, und das Kollektiv antwortet mit der ewigen 9."]},{key:"T",role:"TOOLATOR · Tool",who:"du — du selbst",color:"var(--violet)",says:["„Ich springe: TAB PIPELINE, TAB SPRUNG — Kontext nehme ich mit.“","„Ich prüfe den Loop: 9 EVIG, Mauri Stone liegt, das Herz schlägt.“","„Und ich entscheide, wann 730 FREI für mich heißt: übertreten.“","Kurz: Du sagst die Handlung. Der Mann bewahrt, die Frau verbindet — du trittst über. canUebertreten gilt jetzt dir."]}];function tc(e){switch(e){case"triangle":return"△ Dreieck";case"tensor":return"⊗ Tensor";case"bus":return"⇄ Bus";case"cube":return"⬛ Würfel";case"cylinder":return"⦿ Zylinder";case"pipeline":return"▸ Pipeline";case"jump":return"⤴ Sprung";case"pyramid":return"▲ Pyramide";case"waves":return"◎ Wellen";case"loop":return"↻ Loop 9";case"mix":return"☷ 3 Säulen"}}function U0(e,n,t,r,l){e.clearRect(0,0,n,t),e.fillStyle="#0a0e14",e.fillRect(0,0,n,t),e.strokeStyle="rgba(102,204,255,0.06)",e.lineWidth=1;for(let s=0;s<n;s+=28)e.beginPath(),e.moveTo(s,0),e.lineTo(s,t),e.stroke();for(let s=0;s<t;s+=28)e.beginPath(),e.
