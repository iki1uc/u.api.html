@keyframes blinkc {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0;
  }
}
.cursor-blink {
  animation: blinkc 1.05s steps(1) infinite;
}
@keyframes pulse-dot {
  0%, 100% {
    opacity: 1;
    box-shadow: 0 0 0 0 rgba(43, 255, 158, 0.55);
  }
  50% {
    opacity: 0.65;
    box-shadow: 0 0 0 6px rgba(43, 255, 158, 0);
  }
}
.pulse-dot {
  animation: pulse-dot 1.6s ease-in-out infinite;
}
@keyframes spin-slow {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
.spin-slow {
  animation: spin-slow 16s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.spin-slower-rev {
  animation: spin-slow 26s linear infinite reverse;
  transform-box: fill-box;
  transform-origin: center;
}

  }
}
.dash-flow {
  stroke-dasharray: 5 4;
  animation: dash-flow 1.4s linear infinite;
}
@keyframes node-pulse {
  0%, 100% {
    opacity: 0.35;
  }
  50% {
    opacity: 1;
  }
}
.node-pulse {
  animation: node-pulse 2.2s ease-in-out infinite;
}
@keyframes scan-drift {
  0% {
    transform: translateY(-120%);
  }
  100% {
    transform: translateY(1200%);
  }
}
.scan-bar {
  animation: scan-drift 7s linear infinite;
}
@keyframes crt-flicker {
  0%, 100% {
    opacity: 1;
  }
  92% {
    opacity: 1;
  }
  93% {
    opacity: 0.86;
  }
  94% {
    opacity: 1;
  }
  97% {
    opacity: 0.94;
  }
  98% {
    opacity: 1;
  }
}
.crt-flicker {
  animation: crt-flicker 4.5s linear infinite;
}
@keyframes rise-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.rise-in {
  animation: rise-in 0.25s ease-out both;
}
