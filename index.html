:root {
  --bg: #010304;
  --surface: #041014;

  --amber: #ffd166;
  --red: #ff5d73;
  --text: #d7fbff;
  --muted: #5f8b94;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #010304;
    --surface: #041014;
    --surface-2: #061a20;
    --line: #0e3a42;
    --line-bright: #155e6b;

  }
}
html,
body {

  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
::-moz-selection {
  background: rgba(34, 230, 255, 0.35);
  color: #ffffff;
}
::selection {
  background: rgba(34, 230, 255, 0.35);
  color: #ffffff;
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-bright) transparent;
}
*::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
*::-webkit-scrollbar-thumb {
  background: var(--line-bright);
}
*::-webkit-scrollbar-track {
  background: transparent;
}
@keyframes blinkc {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0;
  }
}
.cursor-blink {
  animation: blinkc 1.05s steps(1) infinite;
}
@keyframes pulse-dot {
  0%, 100% {
    opacity: 1;
    box-shadow: 0 0 0 0 rgba(43, 255, 158, 0.55);
  }
  50% {
    opacity: 0.65;
    box-shadow: 0 0 0 6px rgba(43, 255, 158, 0);
  }
}
.pulse-dot {
  animation: pulse-dot 1.6s ease-in-out infinite;
}
@keyframes spin-slow {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
.spin-slow {
  animation: spin-slow 18s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.spin-slower-rev {
  animation: spin-slow 30s linear infinite reverse;
  transform-box: fill-box;
  transform-origin: center;
}
@keyframes dash-flow {
  to {
    stroke-dashoffset: -28;
  }
}
.dash-flow {
  stroke-dasharray: 5 4;
  animation: dash-flow 1.1s linear infinite;
}
.dash-flow-fast {
  stroke-dasharray: 5 4;
  animation: dash-flow 0.35s linear infinite;
}
@keyframes node-pulse {
  0%, 100% {
    opacity: 0.35;
  }
  50% {
    opacity: 1;
  }
}
.node-pulse {
  animation: node-pulse 2.2s ease-in-out infinite;
}
@keyframes tri-pulse {
  0%, 100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}
.tri-pulse {
  animation: tri-pulse 2.6s ease-in-out infinite;
}
@keyframes scan-drift {
  0% {
    transform: translateY(-120%);
  }
  100% {
    transform: translateY(1400%);
  }
}
.scan-bar {
  animation: scan-drift 8s linear infinite;
}
@keyframes crt-flicker {
  0%, 100% {
    opacity: 1;
  }
  92% {
    opacity: 1;
  }
  93% {
    opacity: 0.88;
  }
  94% {
    opacity: 1;
  }
  97% {
    opacity: 0.95;
  }
  98% {
    opacity: 1;
  }
}
.crt-flicker {
  animation: crt-flicker 5s linear infinite;
}
@keyframes rise-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.rise-in {
  animation: rise-in 0.25s ease-out both;
}
@keyframes homage-flash {
  0% {
    box-shadow: 0 0 0 rgba(34, 230, 255, 0);
  }
  30% {
    box-shadow: 0 0 26px rgba(34, 230, 255, 0.75), 0 0 60px rgba(43, 255, 158, 0.35);
  }
  100% {
    box-shadow: 0 0 0 rgba(34, 230, 255, 0);
  }
}
.homage-flash {
  animation: homage-flash 1.6s ease-out both;
}
@keyframes fly-in {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.fly-in {
  animation: fly-in 0.45s ease-out both;
}
.fly-out {
  opacity: 0.25;
  transform: scale(0.97);
  transition: all 0.45s ease;
}
.bg-blueprint {
  background-image:
    linear-gradient(rgba(34, 230, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34, 230, 255, 0.05) 1px, transparent 1px);
  background-size: 34px 34px;
}
.scanlines::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.025) 0px,
    rgba(255, 255, 255, 0.025) 1px,
    transparent 1px,
    transparent 4px
  );
}
